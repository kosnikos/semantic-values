# Model ids and prices: the single source. USD per 1M tokens.
# Prices cached 2026-11-03: re-check against the provider's price list before large runs.
# Haiku 5.5 has a second, dearer card for prompts over 100K tokens; our prompts stay far
# below that. Fallback-model cache prices assume the usual 1.25x write / 0.1x read.
# Never delete a row (old run manifests name it); retire it with requestable: false.
# server_fallbacks: the model accepts server-side refusal fallbacks (Haiku 5.5 has none).
# batch_factor: the batch API charges this fraction of every component.
batch_factor: 0.5
models:
  - id: claude-haiku-5-5
    provider: anthropic
    prices: {input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01}
    requestable: true
    server_fallbacks: false
  - id: claude-sonnet-5-5
    provider: anthropic
    prices: {input: 2.0, output: 10.0, cache_write: 2.50, cache_read: 0.10}
    requestable: true
    server_fallbacks: true
  - id: claude-opus-5-5
    provider: anthropic
    prices: {input: 4.0, output: 20.0, cache_write: 5.00, cache_read: 0.20}
    requestable: true
    server_fallbacks: true
  - id: claude-sonnet-5
    provider: anthropic
    prices: {input: 2.0, output: 10.0, cache_write: 2.50, cache_read: 0.20}
    requestable: false
    server_fallbacks: false
  - id: claude-opus-5
    provider: anthropic
    prices: {input: 5.0, output: 25.0, cache_write: 6.25, cache_read: 0.50}
    requestable: false
    server_fallbacks: false
  - id: claude-opus-4-8
    provider: anthropic
    prices: {input: 5.0, output: 25.0, cache_write: 6.25, cache_read: 0.50}
    requestable: false
    server_fallbacks: false
