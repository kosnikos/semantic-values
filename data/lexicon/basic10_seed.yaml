# Seed word list for the lexicon baseline, level basic10 of schwartz19.
# Provenance: written by the semantic-values project itself (about 12 English stems per
# target), NOT taken from the Personal Values Dictionary (Ponizovskiy et al. 2020,
# https://osf.io/vt8nf): no redistribution licence for the dictionary files could be
# confirmed, so none of its words are copied. Licence of this file: same as the repo data.
# Matching: case-insensitive, word-initial stem followed by any word characters.
